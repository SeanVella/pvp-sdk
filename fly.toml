app = "pvp-sdk"
primary_region = "iad"
kill_timeout = "120s"

[build]
dockerfile = "server/Dockerfile"
ignorefile = ".dockerignore"

[env]
# SDK bug reports land on the mounted volume so they survive deploys/restarts.
BUG_REPORTS_FILE = "/opt/server/data/bug-reports.jsonl"
# Grand Exchange escrow and authoritative player checkpoints survive redeploys.
GE_DATABASE = "/opt/server/data/market.sqlite"
# Comma-separated usernames kept off every hiscores board (e.g. staff or test accounts).
HISCORES_HIDDEN_NAMES = ""
NODE_DEBUG = "true"
BUILD_STARTUP = "false"
BUILD_STARTUP_UPDATE = "false"
DB_BACKEND = "sqlite"
EASY_STARTUP = "true"
FRIEND_SERVER = "true"
LOGIN_SERVER = "true"
NODE_MEMBERS = "true"
NODE_PORT = "43594"
NODE_RANDOM_EVENTS = "false"
NODE_TICKRATE = "300"
NODE_XPRATE = "25"
WEBSITE_REGISTRATION = "false"
WEB_PORT = "8080"
# pvp-sdk: the spectator feed for the rs-world 3D viewer. It shows every player's position and
# gear, so it's the owner's: WORLD_FEED_TOKEN is a Fly secret, required as ?token= on connect.
WORLD_FEED = "true"
# Our own viewer (https://seanvella.github.io/rs-world/) is built from this server's cache, so
# it renders this fork's npcs; no base-game look-alikes needed.
WORLD_FEED_STAND_INS = "false"
# The spectator viewer sends a small heartbeat; inactive sockets are closed after two minutes.
WORLD_FEED_MAX_CLIENTS = "128"
WORLD_FEED_IDLE_TIMEOUT_MS = "120000"
# Gateway's direct listener (see the 7443 service below).
GATEWAY_PUBLIC_PORT = "7781"
# Concurrent game sessions per source IP (code default 200). Keyed on
# Fly-Client-IP, which clients can't spoof.
MAX_PLAYERS_PER_IP = "100"
# pvp-sdk: fair play (docs/FAIR_PLAY.md) - 5 bots per player per season, made on /account by a
# phone-verified player; only those bots log in. It starts enforcing once the Fly secrets
# ACCOUNTS_SECRET, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_VERIFY_SERVICE_SID,
# TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY are all set; until then the server runs as before.
PLAYER_ACCOUNTS = "true"
BOTS_PER_PLAYER = "5"

# One machine is the whole world: never auto-stop it, and never run a second
# copy (a second machine would be a separate, empty world with its own volume).
[http_service]
auto_start_machines = true
auto_stop_machines = "off"
force_https = true
internal_port = 8080
min_machines_running = 1

[[mounts]]
destination = "/opt/server/data"
source = "lostcity_data"

# No plain-TCP game port (43594): its login block is encrypted only with the RSA key
# committed in this public repo, so anyone on the path could read passwords. Every web
# and lite client connects over WSS through the HTTPS service above.

# SDK gateway, direct: wss://pvp-sdk.fly.dev:7443. Compressed state frames,
# and the relay work stays off the game server's tick thread. The SDK and lite
# runner prefer it and fall back to wss://.../gateway if it is unreachable.
[[services]]
internal_port = 7781
protocol = "tcp"

  [[services.ports]]
  port = 7443
  handlers = ["tls", "http"]

# Target is performance-1x (dedicated CPU keeps the tick steady); new Fly orgs are
# refused performance machines until billing unlocks them, so start on shared CPU:
#   fly scale vm performance-1x --memory 2048 -a pvp-sdk
[[vm]]
memory = "2gb"
size = "shared-cpu-2x"
